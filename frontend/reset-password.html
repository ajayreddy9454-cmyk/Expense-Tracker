<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker - Reset Password</title>

    <!-- ===== ANTI-FOUC: Apply saved theme before paint ===== -->
    <script>
        (function() {
            var theme = localStorage.getItem("theme");
            if (theme === "dark") {
                document.documentElement.classList.add("dark-mode");
                var style = document.createElement("style");
                style.textContent = "html.dark-mode{--dark:#FFFFFF;--gray:#D1D5DB;--border:#374151;--background:#111827;--card:#1F2937;--sidebar-bg:#111827;--navbar-bg:#111827;--input-bg:#374151;--text-primary:#FFFFFF;--text-secondary:#D1D5DB;--hover-bg:#1F2937;--primary-light:rgba(99,102,241,0.15)}";
                document.head.insertBefore(style, document.head.querySelector('link[rel="stylesheet"]'));
            }
        })();
    </script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/toast.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Left Side -->

    <div class="left">

        <div class="brand">

            <div class="logo">

                <i class="fa-solid fa-wallet"></i>

            </div>

            <h1>Expense Tracker</h1>

            <p>
                Track your expenses, manage your budget and save more.
            </p>

        </div>

        <div class="login-card">

            <h2>Reset Password 🔒</h2>

            <p>
                Enter your new password
            </p>

            <form id="resetPasswordForm" autocomplete="off">

                <div class="field">
                    <label for="reset_password">New Password</label>
                    <input id="reset_password" name="password" type="password" required minlength="6" placeholder="Enter new password" />
                </div>

                <div class="field">
                    <label for="reset_confirm_password">Confirm Password</label>
                    <input id="reset_confirm_password" name="confirm_password" type="password" required minlength="6" placeholder="Confirm new password" />
                </div>

                <button id="resetPasswordButton" type="submit">Reset Password</button>

                <div class="form-message" style="display:none;"></div>

                <div class="register-link">
                    <span>Remember your password?</span>
                    <a href="index.html">Sign In</a>
                </div>

            </form>

        </div>

    </div>

    <!-- Right Side -->

    <div class="right">

        <div class="circle circle1"></div>

        <div class="circle circle2"></div>

        <div class="circle circle3"></div>

        <div class="content">

            <h2>Manage Money Smartly</h2>
            <p>
                Monitor every expense.

                Analyze spending.

                Build better financial habits.

            </p>

        </div>

    </div>

</div>

<script src="js/toast.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
