    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ===== ANTI-FOUC: Apply user-specific theme BEFORE first paint ===== -->
    <script>
        (function() {
            var userId = null;
            try {
                var stored = localStorage.getItem("currentUser");
                if (stored) {
                    var user = JSON.parse(stored);
                    if (user && user.id) userId = user.id;
                }
            } catch(e) {}
            var theme = userId ? localStorage.getItem("theme_" + userId) : null;
            if (theme === "dark") {
                document.documentElement.classList.add("dark-mode");
                var style = document.createElement("style");
                style.textContent = "html.dark-mode{--dark:#FFFFFF;--gray:#D1D5DB;--border:#374151;--background:#111827;--card:#1F2937;--sidebar-bg:#111827;--navbar-bg:#111827;--input-bg:#374151;--text-primary:#FFFFFF;--text-secondary:#D1D5DB;--hover-bg:#1F2937;--primary-light:rgba(99,102,241,0.15)}";
                document.head.insertBefore(style, document.head.querySelector('link[rel="stylesheet"]'));
            }
        })();
    </script>

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/dashboard.css">

    <link rel="stylesheet"
          href="css/categories.css">

    <link rel="stylesheet"
          href="css/responsive.css">

    <!-- Toast & Modal CSS -->
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/modal.css">

    <style>
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999;justify-content:center;align-items:center;}
        .modal-overlay.active{display:flex;}
        .modal{background:var(--card);border-radius:20px;padding:30px;width:420px;max-width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.2);border:1px solid var(--border);}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
        .modal-header h3{font-size:22px;color:var(--text-primary);}
        .modal-close-btn{background:none;border:none;font-size:28px;cursor:pointer;color:var(--text-secondary);}
        .modal-close-btn:hover{color:var(--text-primary);}
        .modal-body label{display:block;font-size:14px;font-weight:500;color:var(--text-primary);margin-bottom:6px;}
        .modal-body input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;font-size:15px;margin-bottom:16px;box-sizing:border-box;background:var(--input-bg);color:var(--text-primary);}
        .modal-body input:focus{outline:none;border-color:var(--primary);}
        .modal-footer{display:flex;justify-content:flex-end;gap:12px;margin-top:8px;}
        .modal-cancel-btn{padding:12px 24px;border:1px solid var(--border);border-radius:12px;background:var(--card);cursor:pointer;font-size:15px;font-weight:500;color:var(--text-primary);}
        .modal-save-btn{padding:12px 24px;border:none;border-radius:12px;background:#6366F1;color:#fff;cursor:pointer;font-size:15px;font-weight:600;}
        .modal-save-btn:hover{background:#4F46E5;}
        .category-card-actions{display:flex;justify-content:center;gap:10px;margin-top:15px;}
        .category-card-actions button{padding:6px 14px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;}
        .category-edit-btn{background:var(--primary-light);color:var(--primary);}
        .category-edit-btn:hover{background:#E0E7FF;}
        .category-delete-btn{background:#FEF2F2;color:#EF4444;}
        .category-delete-btn:hover{background:#FEE2E2;}
        body.dark-mode .category-delete-btn{background:rgba(239,68,68,0.15);}
        body.dark-mode .category-delete-btn:hover{background:rgba(239,68,68,0.25);}
        body.dark-mode .category-edit-btn:hover{background:rgba(99,102,241,0.25);}
    </style>
